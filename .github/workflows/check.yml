# 每次推送自动检查：前端类型/测试 + Rust 编译（无需本地工具链）
# 推送代码即可看到检查结果，不必等打 v* 标签
name: 检查

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: 前端：安装 + 类型检查 + 测试
        run: |
          pnpm install
          pnpm exec tsc --noEmit
          pnpm test

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 生成全套应用图标（含 icns/ico）
        run: pnpm tauri icon assets/icons/工作计划管理工作台.png

      - name: Rust：编译检查
        shell: bash
        run: |
          cd src-tauri
          cargo check --message-format=short 2>&1 | tee /tmp/cargo-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 失败时把错误写进 job summary，便于在 Actions 页面直接查看（无需下载日志）
            echo "### cargo check 失败" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error(\[|:)|warning|-->" /tmp/cargo-check.log | head -80 >> "$GITHUB_STEP_SUMMARY" || tail -80 /tmp/cargo-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
