name: Release Tauri Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Cargo check (verify Rust code)
        working-directory: ./src-tauri
        run: cargo check

      - name: Build frontend (verify TypeScript)
        run: pnpm build

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0.5.25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '工作计划管理工作台 v__VERSION__'
          releaseBody: '自动构建发布：工作计划管理工作台桌面端（Windows）'
          releaseDraft: true
          prerelease: false