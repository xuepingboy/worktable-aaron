# 工作计划管理工作台 - 云端构建桌面安装包（无需本地 Rust）
# 触发方式：推送 v* 标签（如 v1.1.0）或手动运行 workflow_dispatch
# 产物：GitHub draft Release 附件（Windows nsis / macOS dmg）
#
# 关键设计：多平台并行时若每个 job 各自调用 tauri-action 创建 release，
# 会偶发「release 已存在(409)」竞态导致 release 漏建。这里拆出独立的
# create-release job 先建好 draft release，再把 releaseId 传给各构建 job，
# 构建 job 只负责上传资产，不再创建 release，彻底消除竞态。
name: 构建桌面版

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # 单独一个平台预建 draft release，输出 release_id 供构建 job 复用
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - name: 创建 draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 工作计划管理工作台 ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖（自动同步 lockfile）
        run: pnpm install

      - name: 生成全套应用图标（含 icns/ico）
        run: pnpm tauri icon assets/icons/工作计划管理工作台.png

      - name: 构建安装包并上传到已建 release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
