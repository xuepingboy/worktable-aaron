[package]
name = "planner"
version = "1.0.0"
description = "工作计划管理工作台桌面端"
authors = ["planner"]
edition = "2021"

# Tauri 桌面壳：Rust 侧保持最小，前端为现有 React 应用（dist/ 产物）
[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：Manager::get_window 被 #[cfg(feature = "unstable")] 门控，
# 挂件 resize 需要 Window 句柄（start_resize_dragging 仅在 Window 上），故开启
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tauri 未公开 re-export ResizeDirection（start_resize_dragging 参数），需直接依赖；
# 版本与 tauri 2.11.5 依赖的 tauri-runtime 2.11.3 一致，cargo 会复用同一份
tauri-runtime = "2"

# 自动更新：默认关闭（需先 `pnpm tauri signer generate` 生成密钥并填入 tauri.conf.json，
# 再 `pnpm tauri build --features updater` 或把 updater 加入默认特性）
tauri-plugin-updater = { version = "2", optional = true }

# 挂件「贴桌面」（bottom-most）：Windows 专用，SetWindowPos(HWND_BOTTOM)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[features]
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
